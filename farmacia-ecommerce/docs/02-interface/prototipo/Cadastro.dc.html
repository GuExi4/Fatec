<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FarmaOn – Criar conta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B66;text-decoration:none}a:hover{color:#0A4F4B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: Inter, system-ui, sans-serif; color: #14201F; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 60px; background: #FFFFFF; border-bottom: 1px solid #DCE5E3; display: flex; align-items: center; gap: 8px; padding: 0 8px; flex-shrink: 0">
  <a href="Login.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14201F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
  <div style="display: flex; flex-direction: column; gap: 1px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.2px; color: #14201F">Farma<span style="color: #0F6B66">On</span></span>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.2">Criar conta</h1>
  </div>
  <img src="/_blob/29886984f162fe8b75b1578e6cb5d188" alt="Grupo Wise" style="height: 28px; width: 47px; margin-left: auto; margin-right: 8px">
</header>
<main style="flex: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="nome" style="font-size: 13px; font-weight: 600">Nome completo</label><input id="nome" type="text" value="[NOME DO CLIENTE]" style="height: 44px; border: 1px solid #9AAAA7; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #14201F"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="cpf" style="font-size: 13px; font-weight: 600">CPF</label><input id="cpf" type="text" value="111.111.111-11" style="height: 44px; border: 1px solid #9AAAA7; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #14201F; border-color: #A3262A"><span style="font-size: 12px; color: #4A5856"><span style="color: #A3262A">CPF inválido</span></span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="nasc" style="font-size: 13px; font-weight: 600">Nascimento</label><input id="nasc" type="text" value="12/03/1990" style="height: 44px; border: 1px solid #9AAAA7; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #14201F"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="email2" style="font-size: 13px; font-weight: 600">E-mail</label><input id="email2" type="email" value="cliente@email.com" style="height: 44px; border: 1px solid #9AAAA7; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #14201F"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="cel" style="font-size: 13px; font-weight: 600">Celular</label><input id="cel" type="text" value="(19) 9____-____" style="height: 44px; border: 1px solid #9AAAA7; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #14201F"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="cep2" style="font-size: 13px; font-weight: 600">CEP</label><input id="cep2" type="text" value="13010-000" style="height: 44px; border: 1px solid #9AAAA7; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #14201F"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="senha2" style="font-size: 13px; font-weight: 600">Senha</label><input id="senha2" type="password" value="********" style="height: 44px; border: 1px solid #9AAAA7; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #14201F"><span style="font-size: 12px; color: #4A5856">Mínimo 8 caracteres, com letras e números</span></div>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; cursor: pointer; min-height: 44px">
  <input type="checkbox" onChange="{{alternar}}" style="width: 20px; height: 20px; accent-color: #0F6B66; flex-shrink: 0">
  <span>Li e aceito os termos de uso e a política de privacidade (LGPD). Tenho 18 anos ou mais.</span>
</label>
</main>
<div style="background: #FFFFFF; border-top: 1px solid #DCE5E3; padding: 12px 20px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0"><sc-if value="{{ok}}" hint-placeholder-val="{{false}}"><a href="Checkout.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #0F6B66; color: #FFFFFF; font-size: 16px; font-weight: 600">Criar conta</a></sc-if>
<sc-if value="{{bloq}}" hint-placeholder-val="{{true}}"><button disabled style="height: 52px; border-radius: 12px; border: 0; background: #C9D4D2; color: #4A5856; font: inherit; font-size: 16px; font-weight: 600">Aceite os termos para continuar</button></sc-if></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { aceite: false }; }
  renderVals() {
    return { ok: this.state.aceite, bloq: !this.state.aceite,
      alternar: () => this.setState({ aceite: !this.state.aceite }) };
  }
}
</script>
</body>
</html>
