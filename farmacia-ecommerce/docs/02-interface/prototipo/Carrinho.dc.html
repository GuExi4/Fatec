<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FarmaOn – Carrinho</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B66;text-decoration:none}a:hover{color:#0A4F4B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: Inter, system-ui, sans-serif; color: #14201F; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 60px; background: #FFFFFF; border-bottom: 1px solid #DCE5E3; display: flex; align-items: center; gap: 8px; padding: 0 8px; flex-shrink: 0">
  <a href="Produto.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14201F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
  <div style="display: flex; flex-direction: column; gap: 1px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.2px; color: #14201F">Farma<span style="color: #0F6B66">On</span></span>
    <h1 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.2">Carrinho</h1>
  </div>
  <img src="/_blob/29886984f162fe8b75b1578e6cb5d188" alt="Grupo Wise" style="height: 28px; width: 47px; margin-left: auto; margin-right: 8px">
</header><div aria-label="Etapa 1 de 4" style="display: flex; padding: 12px 12px 10px; background: #FFFFFF; border-bottom: 1px solid #DCE5E3; flex-shrink: 0"><div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1"><span style="width: 26px; height: 26px; border-radius: 50%; background: #0F6B66; border: 1.5px solid #0F6B66; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span><span style="font-size: 11px; color: #14201F; font-weight: 600">Carrinho</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #9AAAA7; color: #4A5856; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span><span style="font-size: 11px; color: #4A5856; font-weight: 400">Entrega</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #9AAAA7; color: #4A5856; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 11px; color: #4A5856; font-weight: 400">Pagamento</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #9AAAA7; color: #4A5856; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">4</span><span style="font-size: 11px; color: #4A5856; font-weight: 400">Receita</span></div></div>
<main style="flex: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{itens}}" as="i" hint-placeholder-count="2">
  <div style="background: #FFFFFF; border: 1px solid #DCE5E3; border-radius: 14px; padding: 12px; display: flex; gap: 12px">
    <div style="width: 60px; height: 60px; border-radius: 10px; background: #EEF2F1; flex-shrink: 0"></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 14px; font-weight: 600">{{i.nome}}</div>
      <sc-if value="{{i.rx}}" hint-placeholder-val="{{true}}"><span style="background: #FFF1DC; color: #7A4100; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; align-self: flex-start">Exige receita</span></sc-if>
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #4A5856">Qtd {{i.q}}</span><span style="font-weight: 700">R$ [PREÇO]</span></div>
    </div>
    <button onClick="{{i.rm}}" aria-label="Remover item" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; align-self: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg></button>
  </div>
</sc-for>
<sc-if value="{{removido}}" hint-placeholder-val="{{false}}">
  <div role="status" style="background: #14201F; color: #FFFFFF; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 14px">Item removido<button onClick="{{desfazer}}" style="background: transparent; border: 0; color: #B8F0E6; font: inherit; font-weight: 600; height: 44px; cursor: pointer">Desfazer</button></div>
</sc-if>
<div style="background: #FFFFFF; border: 1px solid #DCE5E3; border-radius: 14px; padding: 14px; display: flex; gap: 10px; align-items: center">
  <label for="cep" style="font-size: 13px; color: #4A5856; white-space: nowrap">Frete para</label>
  <input id="cep" value="13010-000" style="flex: 1; height: 44px; border: 1px solid #9AAAA7; border-radius: 10px; padding: 0 12px; font: inherit">
  <button style="height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: #E3F4F1; color: #0A4F4B; font: inherit; font-weight: 600; cursor: pointer">Calcular</button>
</div>
<div style="background: #FFF8EC; border: 1px solid #F0D9B5; border-radius: 12px; padding: 12px; font-size: 13px; color: #5C3300; line-height: 1.45">1 item exige receita. Você enviará a foto dela antes de concluir.</div>
</main>
<div style="background: #FFFFFF; border-top: 1px solid #DCE5E3; padding: 12px 20px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0"><div style="display: flex; justify-content: space-between; font-size: 15px"><span>Subtotal</span><strong>R$ [VALOR]</strong></div><a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #0F6B66; color: #FFFFFF; font-size: 16px; font-weight: 600">Continuar para entrega</a></div>
<nav aria-label="Navegação principal" style="height: 68px; background: #FFFFFF; border-top: 1px solid #DCE5E3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex-shrink: 0"><a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 400; color: #4A5856"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a><a href="Busca.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 400; color: #4A5856"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Busca</a><a href="Carrinho.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0F6B66"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F6B66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="17" cy="20" r="1.4"></circle></svg>Carrinho (2)</a><a href="Pedido.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 400; color: #4A5856"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"></path><path d="M4 7l8 4 8-4M12 11v10"></path></svg>Pedidos</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { gone: null }; }
  renderVals() {
    const all = [
      { id: 1, nome: 'Losartana potássica 50 mg – 30 comp.', rx: true, q: 1 },
      { id: 2, nome: 'Protetor solar FPS 50 – 200 ml', rx: false, q: 1 }
    ];
    return {
      itens: all.filter((x) => x.id !== this.state.gone).map((x) => Object.assign({}, x, { rm: () => this.setState({ gone: x.id }) })),
      removido: this.state.gone !== null,
      desfazer: () => this.setState({ gone: null })
    };
  }
}
</script>
</body>
</html>
