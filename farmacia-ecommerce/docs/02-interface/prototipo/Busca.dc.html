<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FarmaOn – Resultado da busca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B66;text-decoration:none}a:hover{color:#0A4F4B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F7F6; font-family: Inter, system-ui, sans-serif; color: #14201F; display: flex; flex-direction: column; overflow: hidden">
<header style="background: #FFFFFF; border-bottom: 1px solid #DCE5E3; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
  <div style="padding-left: 4px; font-size: 18px; font-weight: 700; color: #14201F">Farma<span style="color: #0F6B66">On</span></div>
  <div style="display: flex; align-items: center; gap: 6px">
    <a href="Main.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14201F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <label for="q" style="position: absolute; left: -9999px">Buscar</label>
    <input id="q" value="losartana" style="flex: 1; height: 44px; border: 1.5px solid #0F6B66; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px; color: #14201F">
    <img src="/_blob/29886984f162fe8b75b1578e6cb5d188" alt="Grupo Wise" style="height: 28px; width: 47px; margin-left: 4px">
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
      <button onClick="{{f.toggle}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>
</header>
<main style="flex: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; color: #4A5856">12 resultados para “losartana” · ordenado por menor preço</div>
<sc-for list="{{itens}}" as="p" hint-placeholder-count="4">
  <a href="Produto.dc.html" style="background: #FFFFFF; border: 1px solid #DCE5E3; border-radius: 14px; padding: 12px; display: flex; gap: 12px; color: #14201F">
    <div style="width: 72px; height: 72px; border-radius: 10px; background: #EEF2F1; flex-shrink: 0"></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 14px; font-weight: 600">{{p.nome}}</div>
      <div style="font-size: 12px; color: #4A5856">{{p.fab}}</div>
      <div style="display: flex; gap: 6px; align-items: center"><span style="background: #FFF1DC; color: #7A4100; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px">Exige receita</span><sc-if value="{{p.gen}}" hint-placeholder-val="{{true}}"><span style="background: #E3F4F1; color: #0A4F4B; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px">Genérico</span></sc-if></div>
      <div style="font-size: 16px; font-weight: 700">R$ [PREÇO]</div>
    </div>
  </a>
</sc-for>
</main>

<nav aria-label="Navegação principal" style="height: 68px; background: #FFFFFF; border-top: 1px solid #DCE5E3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex-shrink: 0"><a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 400; color: #4A5856"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a><a href="Busca.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0F6B66"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F6B66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Busca</a><a href="Carrinho.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 400; color: #4A5856"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="17" cy="20" r="1.4"></circle></svg>Carrinho (2)</a><a href="Pedido.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 400; color: #4A5856"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"></path><path d="M4 7l8 4 8-4M12 11v10"></path></svg>Pedidos</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { gen: true } }; }
  renderVals() {
    const base = 'height: 36px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; ';
    const defs = [['gen', 'Genérico'], ['ref', 'Referência'], ['preco', 'Até R$ 30'], ['est', 'Em estoque']];
    return {
      filtros: defs.map(([k, l]) => {
        const on = !!this.state.on[k];
        return { label: l, on: on ? 'true' : 'false',
          style: base + (on ? 'background: #0F6B66; color: #FFFFFF; border: 1px solid #0F6B66' : 'background: #FFFFFF; color: #14201F; border: 1px solid #9AAAA7'),
          toggle: () => this.setState({ on: Object.assign({}, this.state.on, { [k]: !on }) }) };
      }),
      itens: [
        { nome: 'Losartana potássica 50 mg – 30 comp.', fab: 'Laboratório A · genérico', gen: true },
        { nome: 'Losartana potássica 50 mg – 60 comp.', fab: 'Laboratório B · genérico', gen: true },
        { nome: 'Losartana potássica 100 mg – 30 comp.', fab: 'Laboratório A · genérico', gen: true },
        { nome: 'Losartana + HCTZ 50/12,5 mg – 30 comp.', fab: 'Laboratório C · genérico', gen: true }
      ]
    };
  }
}
</script>
</body>
</html>
